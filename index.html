<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 12414</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>

<div class="login-page">
    <div class="login-box">

        <div class="login-header">
            <div class="login-title">The 12414</div>
            <div class="login-subtitle">Family Hub</div>
        </div>

        <div class="login-card">
            <input class="input" type="text"     id="username" placeholder="Your name"  autocomplete="username"         />
            <input class="input" type="password" id="password" placeholder="Password"   autocomplete="current-password" />
            <button class="btn btn-primary btn-full" id="login-btn" onclick="login()">Sign In</button>
            <div class="msg msg-error" id="error-msg"></div>
        </div>

        <div class="login-footer">
            <button onclick="Theme.openPanel()">⚙ Appearance</button>
        </div>

    </div>
</div>

<!-- Theme Panel -->
<div id="theme-overlay" class="theme-overlay" onclick="App.handleOverlayClick(event, 'theme-overlay')">
    <div class="theme-panel">
        <div class="theme-panel-header">
            <h3>Appearance</h3>
            <button class="btn-icon" onclick="Theme.closePanel()">✕</button>
        </div>
        <div class="section-label">Color Theme</div>
        <div id="theme-swatches" class="theme-swatches"></div>
        <div class="section-label">Mode</div>
        <div id="mode-buttons" class="mode-buttons"></div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
    // Already logged in? Go home.
    if (Auth.getSession()) window.location.href = 'home.html';

    Theme.renderPanel();

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorEl  = document.getElementById('error-msg');
        const btn      = document.getElementById('login-btn');

        errorEl.textContent = '';
        btn.disabled    = true;
        btn.textContent = 'Signing in...';

        try {
            await Auth.login(username, password);
            window.location.href = 'home.html';
        } catch (err) {
            errorEl.textContent = err.message;
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Sign In';
        }
    }

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
