<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 12414 - House Dash</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="js/theme.js"></script>
</head>
<body>

<header class="sub-header">
    <button class="btn-back" onclick="window.location.href='home.html'">&larr;</button>
    <h2>House Dash</h2>
    <div id="header-avatar-area"></div>
    <button class="btn btn-ghost" onclick="Theme.openPanel()">&#9881;</button>
</header>

<div class="game-page">
    <div class="game-shell">
        <div class="game-topbar">
            <div class="game-stat">
                <span>Score</span>
                <strong id="game-score">0</strong>
            </div>
            <div class="game-stat">
                <span>Hearts</span>
                <strong id="game-hearts">3</strong>
            </div>
            <div class="game-stat">
                <span>Floor</span>
                <strong id="game-floor">1</strong>
            </div>
            <div class="game-stat">
                <span>Best</span>
                <strong id="game-best">0</strong>
            </div>
        </div>

        <div class="game-canvas-wrap">
            <canvas id="house-dash-canvas" width="960" height="540"></canvas>
            <div id="game-overlay" class="game-overlay-panel">
                <h3>12414 House Dash</h3>
                <p>Find Oliver and Luna, check every room, and reach the attic hatch.</p>
                <button class="btn btn-primary" id="game-start-btn">Start Run</button>
            </div>
        </div>

        <div class="game-controls">
            <button class="game-control-btn" id="btn-left" aria-label="Move left">&larr;</button>
            <button class="game-control-btn" id="btn-jump" aria-label="Jump">Jump</button>
            <button class="game-control-btn" id="btn-action" aria-label="Use door or stairs">Door</button>
            <button class="game-control-btn" id="btn-right" aria-label="Move right">&rarr;</button>
        </div>

        <div class="game-meta-grid">
            <div class="game-card">
                <div class="game-card-title">Recent Runs</div>
                <div id="game-recent" class="game-list muted">Loading...</div>
            </div>
            <div class="game-card">
                <div class="game-card-title">Leaderboard</div>
                <div id="game-leaderboard" class="game-list muted">Loading...</div>
            </div>
        </div>
    </div>
</div>

<!-- Theme Panel -->
<div id="theme-overlay" class="theme-overlay"
     onclick="App.handleOverlayClick(event,'theme-overlay')">
    <div class="theme-panel">
        <div class="theme-panel-header">
            <h3>Appearance</h3>
            <button class="btn-icon" onclick="Theme.closePanel()">&#10005;</button>
        </div>
        <div class="section-label">Color Theme</div>
        <div id="theme-swatches" class="theme-swatches"></div>
        <div class="section-label">Mode</div>
        <div id="mode-buttons" class="mode-buttons"></div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/xapi.js"></script>
<script src="js/app.js"></script>
<script src="js/avatar.js"></script>
<script src="js/game-xapi.js"></script>
<script src="js/game.js"></script>
<script>
const session = Auth.requireSession();
if (!session) throw new Error('No session');
Theme.renderPanel();

Avatar.loadProfile(session).then(profile => {
    Avatar.applyProfileTheme(profile);
    Avatar.updateHeader(profile);
    HouseDash.init(session, profile);
});
</script>
</body>
</html>
